<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

  <!-- Primary Meta Tags -->
  <title>Loopy — A Free Daily Loop Logic Puzzle</title>
  <meta name="title" content="Loopy — A Free Daily Loop Logic Puzzle">
  <meta name="description" content="Draw one closed loop that satisfies every number. A new Loopy logic puzzle every day in three difficulties. Free, no sign-up, plays in your browser.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)">

  <!-- Favicons -->
  <!-- Standard PNG favicon for iOS Safari favorites/bookmarks -->
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">
  <!-- SVG favicon with dark mode support (for browsers that support it) -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="./favicon-dark.svg" media="(prefers-color-scheme: dark)">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://loopy.wtf/">

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://loopy.wtf/">
  <meta property="og:title" content="Loopy — A Free Daily Loop Logic Puzzle">
  <meta property="og:description" content="Draw one closed loop that satisfies every number. A new logic puzzle every day, in three difficulties. Free, no sign-up.">
  <meta property="og:site_name" content="Loopy">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://loopy.wtf/">
  <meta name="twitter:title" content="Loopy — A Free Daily Loop Logic Puzzle">
  <meta name="twitter:description" content="Draw one closed loop that satisfies every number. A new logic puzzle every day, in three difficulties. Free, no sign-up.">

  <!-- Open Graph Image -->
  <meta property="og:image" content="https://loopy.wtf/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Loopy - a free daily loop logic puzzle">

  <!-- Twitter Card Image -->
  <meta name="twitter:image" content="https://loopy.wtf/og-image.png">
  <meta name="twitter:image:alt" content="Loopy - a free daily loop logic puzzle">

  <!-- Mobile Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Loopy">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="/src/tokens.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Home View -->
    <div id="home-view" class="view">
      <!-- Hamburger menu. Sits above the sheet so the icon swaps in place
           rather than being covered, but below the bottom sheet overlay so
           the tutorial stacks over it. -->
      <button id="home-menu-toggle" class="home-menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="home-menu-sheet">
        <span class="home-menu-icon-stack">
          <span class="home-menu-icon home-menu-icon-open"><i data-lucide="menu" width="24" height="24"></i></span>
          <span class="home-menu-icon home-menu-icon-close"><i data-lucide="x" width="24" height="24"></i></span>
        </span>
      </button>
      <div id="home-menu-scrim" class="home-menu-scrim" aria-hidden="true"></div>
      <nav id="home-menu-sheet" class="home-menu-sheet" aria-label="Menu" aria-hidden="true">
        <ul class="home-menu-list">
          <li><button id="home-menu-tutorial" class="home-menu-item" tabindex="-1">How to play</button></li>
          <li><button id="home-menu-unlimited" class="home-menu-item" tabindex="-1">Unlimited</button></li>
          <li><a class="home-menu-item" href="https://ko-fi.com/alexduckmanton" target="_blank" rel="noopener noreferrer" tabindex="-1">Support Loopy</a></li>
          <li><a class="home-menu-item" href="https://bsky.app/profile/alexduckmanton.bsky.social" target="_blank" rel="noopener noreferrer" tabindex="-1">Give feedback</a></li>
        </ul>
      </nav>

      <div class="home-container">
        <!-- Title and actions each take half the screen, so the title sits
             centred in the top half and the buttons in the bottom half -->
        <div class="home-title-section">
          <h1 class="game-title">Loopy</h1>
          <p class="game-tagline">A daily path-drawing puzzle</p>
        </div>
        <div class="home-actions">
          <!-- Fixed-height slot holding either the streak line or the tutorial
               button. Both start hidden so the space is reserved from first
               paint and nothing shifts once localStorage has been read. -->
          <div class="home-slot">
            <!-- Filled in by views/home.js: the flame varies with the player's
                 reduced-motion preference, so it is not written out here. -->
            <p id="home-streak" class="home-streak"></p>
            <button id="tutorial-btn" class="btn btn-large">
              <span>How to play</span>
            </button>
          </div>
          <div class="home-buttons">
            <button id="easy-btn" class="btn btn-large">
              <i class="btn-complete-icon" data-lucide="trophy" width="20" height="20"></i>
              <span>Easy</span>
            </button>
            <button id="medium-btn" class="btn btn-large">
              <i class="btn-complete-icon" data-lucide="trophy" width="20" height="20"></i>
              <span>Tricky</span>
            </button>
            <button id="hard-btn" class="btn btn-large">
              <i class="btn-complete-icon" data-lucide="trophy" width="20" height="20"></i>
              <span>Diabolical</span>
            </button>
            <!-- Unlimited lives in the hamburger menu, not the main stack -->
          </div>
        </div>
      </div>
    </div>

    <!-- Play View (Game) -->
    <div id="play-view" class="view">
      <header class="top-bar">
        <button id="back-btn" class="icon-btn" aria-label="Back">
          <i data-lucide="arrow-left" width="24" height="24"></i>
        </button>
        <h1 id="game-title" class="top-bar-title"></h1>
        <div class="top-bar-actions">
          <button id="new-btn" class="icon-btn" aria-label="New puzzle">
            <i data-lucide="dices" width="24" height="24"></i>
          </button>
          <button id="help-btn" class="icon-btn" aria-label="Help">
            <i data-lucide="circle-help" width="24" height="24"></i>
          </button>
          <button id="settings-btn" class="icon-btn" aria-label="Settings">
            <i data-lucide="settings" width="24" height="24"></i>
          </button>
        </div>
      </header>
      <main class="game-container">
        <p id="game-timer">0:00</p>
        <div id="canvas-container" class="canvas-container">
          <div class="canvas-skeleton"></div>
          <canvas id="game-canvas"></canvas>
        </div>
        <div class="game-controls">
          <button id="finish-btn" class="btn btn-secondary" style="display: none;">
            <i data-lucide="check" width="18" height="18"></i>
            <span>End</span>
          </button>
          <button id="restart-btn" class="btn btn-secondary">
            <i data-lucide="refresh-ccw" width="18" height="18"></i>
            <span>Clear</span>
          </button>
          <button id="undo-btn" class="btn btn-secondary" disabled>
            <i data-lucide="undo-2" width="18" height="18"></i>
            <span>Undo</span>
          </button>
        </div>
      </main>

      <!-- Settings Content (will be wrapped in bottom sheet dynamically) -->
      <div id="settings-content" style="display: none;">
        <div class="settings-list">
          <div class="settings-item" id="difficulty-settings-item">
            <div class="settings-control">
              <div class="segmented-control" id="difficulty-segmented-control">
                <button class="segment-btn" data-difficulty="easy">Easy</button>
                <button class="segment-btn" data-difficulty="medium">Tricky</button>
                <button class="segment-btn" data-difficulty="hard">Diabolical</button>
              </div>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-select-row" id="hints-row">
              <span class="settings-label">Numbers</span>
              <div class="settings-value-container">
                <span class="settings-value" id="hints-value">Required only</span>
                <i data-lucide="chevron-down" width="16" height="16"></i>
              </div>
              <select id="hints-select">
                <option value="partial">Required only</option>
                <option value="all">Show all</option>
              </select>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-select-row" id="countdown-row">
              <span class="settings-label">Behaviour</span>
              <div class="settings-value-container">
                <span class="settings-value" id="countdown-value">Count down</span>
                <i data-lucide="chevron-down" width="16" height="16"></i>
              </div>
              <select id="countdown-select">
                <option value="on">Count down</option>
                <option value="off">Show total</option>
                <option value="both">Show both</option>
              </select>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-select-row" id="borders-row">
              <span class="settings-label">Borders</span>
              <div class="settings-value-container">
                <span class="settings-value" id="borders-value">Off</span>
                <i data-lucide="chevron-down" width="16" height="16"></i>
              </div>
              <select id="borders-select">
                <option value="off">Off</option>
                <option value="center">Center only</option>
                <option value="full">Full</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
